name: Compilaciones Flutter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-2022
            output: build/windows/x64/runner/Release/
          - target: android
            os: ubuntu-24.04
            output: build/app/outputs/flutter-apk/app-debug.apk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Leer versiones fijadas
        id: versions
        run: |
          $config = Get-Content toolchain.json -Raw | ConvertFrom-Json
          foreach ($key in @('flutter', 'channel', 'java', 'androidPlatform', 'androidBuildTools', 'androidNdk')) {
            "$key=$($config.$key)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}
      - name: Instalar paquetes Android fijados
        if: matrix.target == 'android'
        env:
          SDK_PLATFORM: ${{ steps.versions.outputs.androidPlatform }}
          SDK_BUILD_TOOLS: ${{ steps.versions.outputs.androidBuildTools }}
          SDK_NDK: ${{ steps.versions.outputs.androidNdk }}
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager'
          if (-not (Test-Path $sdkManager)) { throw 'El runner no proporciona Android command-line tools.' }
          & $sdkManager "platforms;android-$env:SDK_PLATFORM" "build-tools;$env:SDK_BUILD_TOOLS" "ndk;$env:SDK_NDK" 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar Android SDK.' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: ${{ steps.versions.outputs.channel }}
      - name: Inicializar y verificar SDK y dependencias
        run: |
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo inicializar Flutter.' }
          ./scripts/check-toolchain.ps1
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Falló la resolución del lockfile.' }
      - name: Compilar Windows
        if: matrix.target == 'windows'
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo habilitar Windows.' }
          flutter build windows --release --no-pub --dart-define=APP_ENV=test
          if ($LASTEXITCODE -ne 0) { throw 'Falló el build Windows.' }
      - name: Compilar APK de prueba
        if: matrix.target == 'android'
        run: |
          flutter config --jdk-dir "$env:JAVA_HOME"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo configurar JDK.' }
          flutter build apk --debug --no-pub --dart-define=APP_ENV=test
          if ($LASTEXITCODE -ne 0) { throw 'Falló el build Android.' }
      - name: Conservar compilación para inspección
        uses: actions/upload-artifact@v4
        with:
          name: autofinance-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
      - name: Probar SQLite en Windows nativo
        if: matrix.target == 'windows'
        run: |
          flutter test integration_test/local_database_test.dart -d windows --no-pub --dart-define=APP_ENV=test
          if ($LASTEXITCODE -ne 0) { throw 'Falló la integración SQLite Windows.' }
      - name: Probar almacén seguro Drive en Windows nativo
        if: matrix.target == 'windows'
        run: |
          flutter test integration_test/windows_drive_access_test.dart -d windows --no-pub --dart-define=APP_ENV=test --dart-define=WINDOWS_CREDENTIAL_TEST=true
          if ($LASTEXITCODE -ne 0) { throw 'Falló Credential Manager Windows.' }
      - name: Habilitar KVM para la prueba Android
        if: matrix.target == 'android'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar SQLite en Android nativo
        if: matrix.target == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.versions.outputs.androidPlatform }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter test integration_test/local_database_test.dart -d emulator-5554 --no-pub --dart-define=APP_ENV=test
