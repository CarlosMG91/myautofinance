name: myautofinance
description: "Base técnica de Autofinance para Windows y Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: 3.0.7
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: 7.2.0
  http: 1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.7.0
  uuid: ^4.6.0

dev_dependencies:
  google_sign_in_platform_interface: 3.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
